import React, { useState } from 'react';
import { CneBulletin } from '../types';
import { 
  ShieldCheck, 
  X, 
  ExternalLink, 
  CheckCircle2, 
  Search, 
  Lock, 
  FileCode, 
  Key, 
  Check, 
  Copy,
  Info
} from 'lucide-react';

interface TransparencyAuditModalProps {
  isOpen: boolean;
  onClose: () => void;
  bulletins: CneBulletin[];
  selectedBulletin?: CneBulletin | null;
}

export const TransparencyAuditModal: React.FC<TransparencyAuditModalProps> = ({
  isOpen,
  onClose,
  bulletins = [],
  selectedBulletin
}) => {
  const safeBulletins = bulletins || [];
  const [activeItem, setActiveItem] = useState<CneBulletin | null>(selectedBulletin || safeBulletins[0] || null);
  const [copiedHash, setCopiedHash] = useState(false);

  if (!isOpen) return null;

  const handleCopyHash = (hash?: string) => {
    if (!hash) return;
    navigator.clipboard.writeText(hash);
    setCopiedHash(true);
    setTimeout(() => setCopiedHash(false), 2000);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-2 sm:p-4 bg-black/80 backdrop-blur-md animate-in fade-in duration-200">
      <div className="bg-[#080C14]/95 border border-white/15 w-full max-w-4xl max-h-[90vh] rounded-2xl shadow-2xl shadow-black/80 flex flex-col overflow-hidden text-slate-200 backdrop-blur-xl">
        
        {/* Header */}
        <div className="p-4 sm:p-5 bg-black/40 border-b border-white/10 flex items-center justify-between">
          <div className="flex items-center gap-3.5">
            <div className="w-11 h-11 rounded-2xl bg-gradient-to-br from-emerald-500 to-teal-700 border border-white/20 flex items-center justify-center text-white shadow-lg shadow-emerald-500/20">
              <ShieldCheck className="w-5 h-5" />
            </div>
            <div>
              <div className="flex items-center gap-2.5">
                <h2 className="text-base sm:text-lg font-bold text-white leading-tight">
                  Registro de Seguridad, Transparencia y Trazabilidad Criptográfica
                </h2>
                <span className="bg-emerald-500/20 text-emerald-300 text-[10px] font-mono px-2.5 py-0.5 rounded-md border border-emerald-500/30">
                  Auditado
                </span>
              </div>
              <p className="text-xs text-slate-400 mt-0.5">
                Verificación de autenticidad institucional, hashes SHA-256 y sellos de firma digital Quipux
              </p>
            </div>
          </div>

          <button
            onClick={onClose}
            className="p-2 text-slate-400 hover:text-white rounded-xl hover:bg-white/10 transition-colors"
          >
            <X className="w-5 h-5" />
          </button>
        </div>

        {/* Content */}
        <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
          
          {/* Transparency Guarantee Banner */}
          <div className="p-4 sm:p-5 bg-gradient-to-r from-emerald-950/40 via-teal-950/30 to-black/50 border border-emerald-500/30 rounded-2xl flex items-start gap-3.5 backdrop-blur-xs">
            <Lock className="w-5 h-5 text-emerald-400 shrink-0 mt-0.5" />
            <div className="text-xs space-y-1.5">
              <h4 className="font-bold text-white uppercase tracking-wide">Garantía de Cadena de Custodia de Datos Electorales:</h4>
              <p className="text-slate-300 leading-relaxed">
                Cada boletín o resolución indexado por el agente de IA es contrastado directamente contra el servidor raíz del Consejo Nacional Electoral (<code className="text-cyan-300 font-mono bg-white/5 px-1.5 py-0.5 rounded">cne.gob.ec</code> / <code className="text-cyan-300 font-mono bg-white/5 px-1.5 py-0.5 rounded">tce.gob.ec</code>), extrayendo el sello de tiempo criptográfico y el código de folio de secretaría.
              </p>
            </div>
          </div>

          {/* Audit Table */}
          <div className="border border-white/10 rounded-2xl overflow-hidden bg-black/40 backdrop-blur-xs shadow-xl">
            <div className="p-3.5 bg-black/50 border-b border-white/10 text-xs font-bold text-slate-300 flex items-center justify-between">
              <span>Documentos CNE Verificados en el Sistema ({safeBulletins.length})</span>
              <span className="text-[11px] text-emerald-400 font-medium">
                ✓ 100% de fuentes oficiales validadas
              </span>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-white/5 text-slate-400 border-b border-white/10 font-medium">
                  <tr>
                    <th className="p-3.5">Código CNE</th>
                    <th className="p-3.5">Tipo / Categoría</th>
                    <th className="p-3.5">Dominio Oficial</th>
                    <th className="p-3.5">Firma Digital</th>
                    <th className="p-3.5">Confiabilidad</th>
                    <th className="p-3.5 text-right">Acción</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-white/5">
                  {safeBulletins.map(b => (
                    <tr 
                      key={b.id}
                      onClick={() => setActiveItem(b)}
                      className={`cursor-pointer transition-colors ${
                        activeItem?.id === b.id ? 'bg-blue-600/20 text-white' : 'hover:bg-white/5'
                      }`}
                    >
                      <td className="p-3.5 font-mono font-bold text-cyan-400">
                        {b.cneCode}
                      </td>
                      <td className="p-3.5 text-slate-300 capitalize">
                        {b.category.replace('_', ' ')}
                      </td>
                      <td className="p-3.5">
                        <span className="inline-flex items-center gap-1.5 text-emerald-400 font-mono text-[11px]">
                          <CheckCircle2 className="w-3.5 h-3.5" />
                          cne.gob.ec
                        </span>
                      </td>
                      <td className="p-3.5 text-slate-400 font-mono text-[11px] truncate max-w-[120px]">
                        {b.authenticity.digitalSignatureFound ? '✓ Quipux Válido' : 'En trámite'}
                      </td>
                      <td className="p-3.5">
                        <span className="px-2.5 py-0.5 rounded-md bg-emerald-500/20 text-emerald-300 text-[10px] font-bold border border-emerald-500/30">
                          {b.authenticity.score}%
                        </span>
                      </td>
                      <td className="p-3.5 text-right">
                        <a
                          href={b.sourceUrl}
                          target="_blank"
                          rel="noopener noreferrer"
                          onClick={e => e.stopPropagation()}
                          className="text-cyan-400 hover:text-cyan-300 inline-flex items-center gap-1 text-[11px] font-semibold"
                        >
                          <span>PDF / Web</span>
                          <ExternalLink className="w-3 h-3" />
                        </a>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Active Item Detail */}
          {activeItem && (
            <div className="p-4.5 bg-black/40 border border-white/10 rounded-2xl space-y-3.5 backdrop-blur-xs">
              <div className="flex flex-wrap items-center justify-between gap-2 border-b border-white/10 pb-3">
                <div className="flex items-center gap-2">
                  <FileCode className="w-4 h-4 text-cyan-400" />
                  <span className="font-bold text-white text-xs">
                    Certificado Criptográfico del Documento: {activeItem.cneCode}
                  </span>
                </div>
                <span className="text-[11px] text-slate-400 bg-white/5 px-2.5 py-0.5 rounded-md border border-white/10">
                  Emitido por: {activeItem.authenticity.cneIssuerDepartment}
                </span>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                <div className="p-3.5 bg-black/50 rounded-xl border border-white/10 space-y-1">
                  <div className="text-[11px] text-slate-400 font-medium">Sello de Seguridad Oficial:</div>
                  <div className="text-emerald-400 font-semibold">{activeItem.authenticity.securitySealText}</div>
                </div>

                <div className="p-3.5 bg-black/50 rounded-xl border border-white/10 space-y-1">
                  <div className="text-[11px] text-slate-400 font-medium flex items-center justify-between">
                    <span>Hash de Integridad (SHA-256):</span>
                    <button
                      onClick={() => handleCopyHash(activeItem.authenticity.verificationHash)}
                      className="text-cyan-400 hover:text-cyan-300 flex items-center gap-1 text-[10px] font-semibold"
                    >
                      {copiedHash ? <Check className="w-2.5 h-2.5 text-emerald-400" /> : <Copy className="w-2.5 h-2.5" />}
                      <span>{copiedHash ? 'Copiado' : 'Copiar Hash'}</span>
                    </button>
                  </div>
                  <code className="text-slate-300 font-mono text-[10px] break-all block">
                    {activeItem.authenticity.verificationHash}
                  </code>
                </div>
              </div>

              <div className="flex items-center justify-between text-[11px] text-slate-400 pt-1">
                <span>Fecha y Hora de Rastreo CNE: {new Date(activeItem.scannedAt).toLocaleString('es-EC')}</span>
                <a
                  href={activeItem.sourceUrl}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-cyan-400 hover:text-cyan-300 flex items-center gap-1 font-semibold"
                >
                  <span>Abrir Documento en Servidor del CNE</span>
                  <ExternalLink className="w-3 h-3" />
                </a>
              </div>
            </div>
          )}

        </div>

        {/* Footer */}
        <div className="p-4 bg-black/40 border-t border-white/10 flex justify-end">
          <button
            onClick={onClose}
            className="px-4 py-2 bg-white/5 hover:bg-white/10 text-slate-200 text-xs font-semibold rounded-xl border border-white/10 transition-all"
          >
            Cerrar Registro
          </button>
        </div>

      </div>
    </div>
  );
};
